<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator Calcu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      height: 120px;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #444;
      border-radius: 8px;
      margin-bottom: 15px;
      resize: none;
    }

    textarea::placeholder {
      color: #777;
      font-style: italic;
    }

    textarea[readonly] {
      background: #e9e9e9;
      border-color: #888;
      color: #333;
    }
  </style>
</head>

<body>
  <textarea placeholder="Type something..."></textarea>
  <textarea readonly placeholder="Output will appear here..."></textarea>
</body>
</html>
