<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Calculator Calcu</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      padding: 20px;
    }

    textarea {
      width: 100%;
      max-width: 500px;
      height: 120px;
      padding: 12px;
      font-size: 16px;
      border: 2px solid #444;
      border-radius: 8px;
      margin-bottom: 15px;
      resize: none;
    }

    textarea::placeholder {
      color: #777;
      font-style: italic;
    }

    textarea[readonly] {
      background: #e9e9e9;
      border-color: #888;
      color: #333;
    }
  </style>
</head>

<body>
  <textarea placeholder="Type something..."></textarea>
  <textarea readonly placeholder="Output will appear here..."></textarea>
<script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>

<script>
const input = document.getElementById("input");
const output = document.getElementById("output");

input.addEventListener("input", () => {
  const expr = input.value.trim();

  if (!expr) {
    output.value = "";
    return;
  }

  try {
    // If no equals sign, just evaluate normally
    if (!expr.includes("=")) {
      output.value = math.evaluate(expr);
      return;
    }

    // Split equation
    const [left, right] = expr.split("=").map(s => s.trim());

    // Detect all variables automatically
    const vars = [...new Set(expr.match(/[a-zA-Z]+/g))];

    if (vars.length === 0) {
      output.value = "No variables found";
      return;
    }

    // Solve equation symbolically
    const solutions = math.solve(left + " = " + right, vars);

    output.value = JSON.stringify(solutions, null, 2);
  } catch (err) {
    output.value = "Invalid equation";
  }
});
</script>

<footer>
  <p>Copyright © 2026 Calculator Calcu</p>
<footer>
</body>
</html>
